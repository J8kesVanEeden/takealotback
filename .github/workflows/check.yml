# Quality gate — runs on every push to main and every PR targeting main.
#
# Runs the full check suite: public-repo check, TypeScript, anchor refs,
# citation completeness, html-validate, internal-link crawl. If any step
# fails, the workflow fails and (for PRs) blocks merge.
name: Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    # `edited` re-runs the check when a PR title or body changes.
    types: [opened, synchronize, reopened, edited]

# Cancel any in-flight check for the same ref so a rapid second push doesn't
# collide on the hardcoded astro-preview ports (4329, 4332) used by
# check-links.mjs and check-a11y.mjs respectively.
concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

# Lock to read-only — this workflow doesn't push, comment, or tag.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history and origin/main: the public-repo check reads every commit
          # in the PR, and check-machine-readable checks edited pages' dates moved.
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          # Match the engines.node floor in package.json — Astro 5
          # supports 18+, but linkinator wants 20+ for native fetch.
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run all checks
        # `check:all` runs astro check, check:anchors, check:citations,
        # check:html, and check:links. Any failure exits non-zero and
        # fails the job.
        env:
          PUBLIC_DENYLIST: ${{ secrets.PUBLIC_DENYLIST }}
        run: npm run check:all
