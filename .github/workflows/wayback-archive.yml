name: Wayback archive

# Auto-pushes the site's key pages to the Internet Archive's Wayback Machine
# after every push to main that affects content. Independent third-party
# version-insurance — if the live site disappears, the snapshots remain
# under web.archive.org.
#
# Pace and budget:
# - The script paces requests at 6s apart (~12 req/min ceiling on SPN).
# - We pass --all so the script fetches the live sitemap and archives
#   every URL it lists (~68 site pages + 2 Takealot live URLs as of
#   Nov 2026). That no longer fits one 25-min job (~25 s per URL → ~29 min;
#   two runs on 2026-11-10 stopped at 24/70 and 39/70), so the list is
#   split across two parallel jobs with --shard=1/2 and --shard=2/2
#   (every other URL each, ~35 URLs ≈ 15 min). Separate runners, separate
#   IPs, so each paces against SPN independently. Add a third shard if
#   the site grows past ~100 URLs.
# - We wait 90s before archiving to give Cloudflare Pages time to redeploy
#   so Wayback captures the new content, not the previous build.
# - Failures (timeouts, 429s) are best-effort; partial archival is fine.
# - Job timeout is 25 min — enough headroom for slow-SPN runs without
#   hitting the cap (a 15-min cap historically tripped at ~20% of runs).

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'astro.config.mjs'
  workflow_dispatch: # allow manual trigger from the Actions tab

# Serialize wayback runs — back-to-back content pushes shouldn't run two
# 25-min archive jobs in parallel; both would pace at 6s and SPN would
# throttle each. Don't cancel-in-progress: let the running job finish so
# at least one push gets fully archived.
concurrency:
  group: wayback-archive
  cancel-in-progress: false

# Workflow only reads the repo and posts to web.archive.org.
permissions:
  contents: read

jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard: ['1/2', '2/2']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Wait for Cloudflare Pages to redeploy
        run: |
          echo "Waiting 90s for Cloudflare Pages to ship the new build..."
          sleep 90

      - name: Push this shard of the sitemap URLs to the Wayback Machine
        run: node scripts/archive-wayback.mjs --all --shard=${{ matrix.shard }}

      - name: Note
        if: always()
        run: |
          echo "Archival run complete. SPN occasionally rate-limits or"
          echo "times out — partial archival is normal. Re-run manually"
          echo "via Actions → Wayback archive → Run workflow if needed."
